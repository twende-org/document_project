name: Document Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run build is "tsc -b && vite build", so this covers the typecheck.
      - name: Production build
        run: npm run build

  build-and-push:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # These values are inlined into the JS bundle, so they are public by
      # nature and have to be fixed at build time. The server only pulls this
      # image; it never builds the app itself.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_APP_API_BASE_URL=https://docs-backend.twendedigital.tech
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/multi-frontend-document_project:latest
            ${{ secrets.DOCKER_USERNAME }}/multi-frontend-document_project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-production:
    name: Deploy to production
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # Orchestration lives in the infra repo; app source is never cloned here.
            cd ~/twendedigital-infra
            git pull --ff-only
            cd apps/docs_frontend

            docker compose pull web
            docker compose up -d
            docker compose ps

            # Probe every replica over IPv4: nginx listens on IPv4 only and
            # localhost resolves to ::1 inside this image.
            ok=0
            for attempt in $(seq 1 20); do
              ok=1
              for cid in $(docker compose ps -q web); do
                docker exec "$cid" wget -q -O /dev/null http://127.0.0.1:80/ >/dev/null 2>&1 || ok=0
              done
              [ "$ok" = "1" ] && echo "all frontend replicas are serving" && break
              sleep 3
            done
            [ "$ok" = "1" ]

            docker image prune -f
